/* --- edit before sending: rotate, crop format, zoom and move, caption --- */
function openEditor(src, o) {
  const im = new Image();
  im.onload = () => { ui.ed = Object.assign({im, src, rot: 0, ratio: 'orig', zoom: 1, px: 0, py: 0, cap: ''}, o || {}); renderEditor(); };
  im.onerror = () => toast('Cette image n’a pas pu être lue.');
  im.src = src;
}
function edCrop(e) {
  const r = e.rot % 180 !== 0, W = r ? e.im.height : e.im.width, H = r ? e.im.width : e.im.height;
  const ar = {orig: W / H, '1:1': 1, '4:5': 4 / 5, '16:9': 16 / 9, '9:16': 9 / 16}[e.ratio];
  let cw = W, ch = W / ar; if (ch > H) { ch = H; cw = H * ar; }
  cw /= e.zoom; ch /= e.zoom;
  const mx = (W - cw) / 2, my = (H - ch) / 2;
  return {W, H, cw, ch, x: mx + e.px * mx, y: my + e.py * my};
}
function edDraw(cv, max) {
  const e = ui.ed, k = edCrop(e), s = Math.min(1, max / Math.max(k.cw, k.ch));
  cv.width = Math.round(k.cw * s); cv.height = Math.round(k.ch * s);
  const g = cv.getContext('2d');
  g.save(); g.scale(s, s); g.translate(-k.x, -k.y);
  g.translate(k.W / 2, k.H / 2); g.rotate(e.rot * Math.PI / 180); g.drawImage(e.im, -e.im.width / 2, -e.im.height / 2); g.restore();
}
function renderEditor() {
  const e = ui.ed, c = chatOf(ui.chatId);
  layer.innerHTML = `<div class="ed" role="dialog" aria-modal="true" aria-label="Préparer la photo">
    <div class="ed-head"><button class="ib" type="button" data-act="edClose" aria-label="Annuler">${I.close}</button><b>${e.ai ? 'Image créée par IA' : 'Préparer avant l’envoi'}</b><span>${c ? esc(chatName(c)) : ''}</span></div>
    <div class="ed-stage"><canvas id="edCv" aria-label="Aperçu : faites glisser pour cadrer"></canvas></div>
    <div class="ed-tools">
      <div class="ed-row"><button class="ib" type="button" data-act="edRot" data-d="-90" aria-label="Pivoter à gauche">${I.rotL}</button><button class="ib" type="button" data-act="edRot" data-d="90" aria-label="Pivoter à droite">${I.rotR}</button>
        <div class="chips" role="group" aria-label="Format">${[['orig', 'Original'], ['1:1', 'Carré'], ['4:5', '4:5'], ['9:16', '9:16'], ['16:9', '16:9']].map(([r, l]) => `<button class="chip" type="button" data-act="edRatio" data-r="${r}" aria-pressed="${e.ratio === r}">${l}</button>`).join('')}</div></div>
      <label class="ed-zoom" for="edZoom">Rogner / zoom<input id="edZoom" type="range" min="1" max="3" step="0.05" value="${e.zoom}"></label>
      <p class="ed-hint">Faites glisser l’image pour choisir la partie gardée.</p>
      <div class="ed-send"><input id="edCap" type="text" maxlength="300" placeholder="Ajouter une légende…" value="${esc(e.cap)}"><button class="send" type="button" data-act="edSend" aria-label="Envoyer">${I.send}</button></div>
    </div></div>`;
  edPaint();
  const cv = $('#edCv'); let drag = null;
  cv.addEventListener('pointerdown', ev => { drag = {x: ev.clientX, y: ev.clientY, px: e.px, py: e.py}; cv.setPointerCapture(ev.pointerId); });
  cv.addEventListener('pointermove', ev => {
    if (!drag) return; const r = cv.getBoundingClientRect(), k = edCrop(e), mx = (k.W - k.cw) / 2 || 1, my = (k.H - k.ch) / 2 || 1, sc = k.cw / r.width;

  });

}

const fmtEv = e => { const d = new Date(e.date + 'T12:00'); return d.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'}) + (e.time ? ' à ' + e.time.replace(':', ' h ') : ''); };
function extraBody(m) {

/* --- flames: days in a row exchanging photos taken with the camera (like Snapchat) --- */
const dayKey = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
function streakOf(c) {
  const s = (S.streaks || {})[c.id]; if (!s || !s.n) return null;
  const today = dayKey(Date.now()), age = Math.round((today - s.day) / DAY);
  if (age > 1) return null;
  return {n: s.n, warn: age === 1};
}
function bumpStreak(c) {
  if (!c) return; S.streaks = S.streaks || {};
  const s = S.streaks[c.id] || {n: 0, day: 0}, today = dayKey(Date.now()), age = Math.round((today - s.day) / DAY);
  if (age === 0 && s.n) return;
  s.n = age === 1 ? s.n + 1 : 1; s.day = today; S.streaks[c.id] = s; save();
  toast(s.n > 1 ? `🔥 ${s.n} jours de suite avec ${first(chatName(c))} !` : `🔥 Série commencée avec ${first(chatName(c))} : envoyez-vous une photo chaque jour`);
  refreshLists(); renderChat();
}
if (!S.streakSeed) { S.streakSeed = 1; S.streaks = {'c-awa': {n: 12, day: dayKey(Date.now() - DAY)}, 'c-sarah': {n: 3, day: dayKey(Date.now())}}; }

/* ---------- v14: add people during a call, mute someone's statuses ---------- */
/* --- calls: "Ajouter" button and a picker inside the call screen --- */
function callPeople(k) {
  if (!k.people) {
    const c = chatOf(ui.chatId);
    k.people = k.cid ? [k.cid] : c && c.type === 'group' ? c.members.filter(id => S.contacts[id]).slice(0, Math.max(1, (k.n || c.members.length + 1) - 1)) : [];
    k.ring = [];
  }

}
const callMax = k => k.kind === 'video' ? MAX_VIDEO : 32;
renderCall = (prev => function () {
  const k = ui.call; if (!k) return;
  const ppl = callPeople(k); k.n = ppl.length + 1 + (k.ring || []).length;
  prev();
  const box = layer.querySelector('.call'); if (!box) return;
  const btns = box.querySelector('.call-btns'), hang = btns && btns.querySelector('.hang');
  if (hang) hang.insertAdjacentHTML('beforebegin', `<button type="button" data-act="callAdd" aria-pressed="${!!k.adding}" aria-label="Ajouter une personne à l’appel">${I.userplus}</button>`);
  if (ppl.length + (k.ring || []).length > 1 || (k.ring || []).length) {
    const top = box.querySelector('.call-top b');
    if (top) top.textContent = ppl.concat(k.ring || []).map(id => first(nameOf(id))).join(', ');
    const av = box.querySelector(':scope > .av');
    const row = `<div class="call-ppl">${ppl.map(id => `<span class="cp-p">${avatar(nameOf(id), (S.contacts[id] || {}).hue || 200, 'sm')}<small>${esc(first(nameOf(id)))}</small></span>`).join('')}${(k.ring || []).map(id => `<span class="cp-p ring">${avatar(nameOf(id), (S.contacts[id] || {}).hue || 200, 'sm')}<small>Sonnerie…</small></span>`).join('')}</div>`;
    if (av) av.outerHTML = row; else box.querySelector('.call-top').insertAdjacentHTML('afterend', row);
  }
  if (k.adding) {
    const inCall = ppl.concat(k.ring || []), left = callMax(k) - 1 - inCall.length;
    const cands = Object.values(S.contacts).filter(p => !inCall.includes(p.id) && !(S.blocked || []).includes(p.id)).sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    box.insertAdjacentHTML('beforeend', `<div class="call-add" role="dialog" aria-label="Ajouter des personnes à l’appel">
      <div class="call-add-h"><b>Ajouter à l’appel</b><span id="caddN">${left > 0 ? `Encore ${left} place${left > 1 ? 's' : ''}${k.kind === 'video' ? ' (8 personnes maximum en vidéo)' : ''}` : 'L’appel est complet : 8 personnes maximum en vidéo.'}</span></div>
      <div class="call-add-l">${cands.map(p => `<label class="pick"><input type="checkbox" name="cadd" value="${p.id}"${left <= 0 ? ' disabled' : ''}>${avatar(p.name, p.hue, 'sm')}<span>${esc(p.name)}</span></label>`).join('') || '<p>Aucun autre contact.</p>'}</div>
      <div class="call-add-b"><button class="btn ghost" type="button" data-act="callAdd">Annuler</button><button class="btn" type="button" data-act="callAddGo">${I.phone}Appeler</button></div></div>`);
  }
})(renderCall);
const _extraChange14 = extraChange;
extraChange = function (t) {

    const boxes = [...layer.querySelectorAll('input[name="cadd"]')], n = boxes.filter(b => b.checked).length;
    boxes.forEach(b => { b.disabled = !b.checked && n >= left; });

Object.assign(ACT, {

/* --- status mute: long press on a status, the ⋮ in the viewer, or the chat menu --- */
const isStMuted = id => (S.mutedSt || []).includes(id);

}

}
