<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#26c6da">
<meta name="description" content="tam-tam : la messagerie qui fait vivre les langues maternelles africaines (version de démonstration).">
<meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%}body{background:#fff}[hidden]{display:none!important}</style>
</head>
<body>
<title>tam-tam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Pacifico&family=Caveat:wght@400;700&family=Bebas+Neue&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one-screen messenger. Phone = one pane at a time with bottom tabs; wide = icon rail + list + conversation side by side. */
:root{
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#f2f2f0; --surface:#ffffff; --surface-2:#f2f2ef; --line:#e6e6e1;
  --fg:#16161a; --fg-2:#5f6066;
  --accent:#26c6da; --accent-strong:#0b7a89; --accent-ink:#ffffff; --accent-soft:#d9f5f9; --accent-line:#26c6da; --accent-hover:#1fb2c5;
  --map-bg:#e7ecdf; --map-water:#b9dcef; --map-road:#ffffff;
  --brand-2:#d4861c; --brand-2-soft:#fbecd2; --brand-2-ink:#6b430a; --live:#d92f45;
  --bubble-in:#ffffff; --bubble-out:#dcf5f8; --quote:rgba(16,32,26,.07);
  --wp-0:#ece5da; --wp-1:#dde9e3; --wp-2:#e2e3ef; --wp-3:#f1e1dc; --chat-dot:rgba(16,32,26,.055);
  --notice:#fcf0c6; --notice-fg:#574510;
  --tick-read:#1f8fd6; --danger:#c43636;
  --shadow:rgba(16,32,26,.16); --shadow-soft:rgba(16,32,26,.1); --overlay:rgba(10,22,17,.48);
  --call-bg:#111113; --call-fg:#eaf4ee; --call-fg-2:#9db5a9; --call-btn:rgba(234,244,238,.14);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#08080a; --surface:#121214; --surface-2:#1e1e22; --line:#2a2a2f;
  --fg:#ededef; --fg-2:#9a9aa3;
  --accent:#26c6da; --accent-strong:#5fdbea; --accent-ink:#ffffff; --accent-soft:#0e3a40; --accent-line:#26c6da; --accent-hover:#1fb2c5;
  --map-bg:#1d2420; --map-water:#183447; --map-road:#3a4540;
  --brand-2:#f0a53a; --brand-2-soft:#3a2a10; --brand-2-ink:#f6cf8e; --live:#ff5a6e;
  --bubble-in:#1e1e22; --bubble-out:#11393f; --quote:rgba(255,255,255,.09);
  --wp-0:#0b1411; --wp-1:#0b181a; --wp-2:#11121c; --wp-3:#191110; --chat-dot:rgba(230,238,234,.045);
  --notice:#2a2512; --notice-fg:#e5d18b;
  --tick-read:#62c2f6; --danger:#f17272;
  --shadow:rgba(0,0,0,.55); --shadow-soft:rgba(0,0,0,.35); --overlay:rgba(0,0,0,.62);
  --call-bg:#111113; --call-fg:#eaf4ee; --call-fg-2:#9db5a9; --call-btn:rgba(234,244,238,.14);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#08080a; --surface:#121214; --surface-2:#1e1e22; --line:#2a2a2f;
  --fg:#ededef; --fg-2:#9a9aa3;
  --accent:#26c6da; --accent-strong:#5fdbea; --accent-ink:#ffffff; --accent-soft:#0e3a40; --accent-line:#26c6da; --accent-hover:#1fb2c5;
  --map-bg:#1d2420; --map-water:#183447; --map-road:#3a4540;
  --brand-2:#f0a53a; --brand-2-soft:#3a2a10; --brand-2-ink:#f6cf8e; --live:#ff5a6e;
  --bubble-in:#1e1e22; --bubble-out:#11393f; --quote:rgba(255,255,255,.09);
  --wp-0:#0b1411; --wp-1:#0b181a; --wp-2:#11121c; --wp-3:#191110; --chat-dot:rgba(230,238,234,.045);
  --notice:#2a2512; --notice-fg:#e5d18b;
  --tick-read:#62c2f6; --danger:#f17272;
  --shadow:rgba(0,0,0,.55); --shadow-soft:rgba(0,0,0,.35); --overlay:rgba(0,0,0,.62);
  --call-bg:#111113; --call-fg:#eaf4ee; --call-fg-2:#9db5a9; --call-btn:rgba(234,244,238,.14);
  color-scheme:dark }

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
svg{display:block}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{position:relative;height:100%;max-width:1320px;margin-inline:auto;display:grid;grid-template-columns:minmax(340px,452px) minmax(0,1fr);background:var(--surface);overflow:hidden}
@media (min-width:1352px){ .app{height:calc(100% - 32px);margin-block:16px;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px var(--shadow-soft)} }

/* ---------- list pane ---------- */
.pane-list{position:relative;min-width:0;min-height:0;display:grid;grid-template-columns:76px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);border-right:1px solid var(--line);background:var(--surface)}
.tabs{grid-row:1/3;display:flex;flex-direction:column;gap:4px;padding:12px 6px;border-right:1px solid var(--line);background:var(--surface-2)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;border-radius:10px;background:none;color:var(--fg-2);font-size:11px;font-weight:500}
.tab .pill{display:grid;place-items:center;width:48px;height:30px;border-radius:15px}
.tab[aria-current="page"]{color:var(--fg);font-weight:700}
.tab[aria-current="page"] .pill{background:var(--accent-soft);color:var(--accent-strong)}
.tab .dot{position:absolute;top:3px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;line-height:17px;text-align:center;font-variant-numeric:tabular-nums}
.tab .dot.mini{min-width:9px;width:9px;height:9px;padding:0;top:6px;left:calc(50% + 12px);background:var(--live)}

.list-head{display:flex;flex-direction:column;gap:10px;padding:14px 16px 10px;min-width:0}
.list-title{display:flex;align-items:center;gap:8px;min-height:36px}
.list-title h1{flex:1;margin:0;font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-.02em;color:var(--fg)}
.list-title h1.brand{color:var(--accent-strong)}
.brand i,.chat-empty b i{font-style:normal;color:var(--brand-2)}
.logo{width:30px;height:30px;flex:none}
.ib{display:grid;place-items:center;width:40px;height:40px;flex:none;border:0;border-radius:50%;background:none;color:var(--fg-2)}
.ib:hover{background:var(--surface-2);color:var(--fg)}
.search{display:flex;align-items:center;gap:8px;padding:0 14px;height:40px;border-radius:20px;background:var(--surface-2);color:var(--fg-2)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg)}
.search input::placeholder{color:var(--fg-2)}
.search:focus-within{outline:2px solid var(--fg);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border:0;border-radius:16px;background:var(--surface-2);color:var(--fg-2);font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.seg{display:flex;gap:4px;padding:3px;border-radius:20px;background:var(--surface-2)}
.seg button{flex:1;padding:6px 10px;border:0;border-radius:17px;background:none;color:var(--fg-2);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px var(--shadow-soft)}

/* statuses strip */
.stories{display:flex;gap:12px;margin-inline:-16px;padding:2px 16px 4px;overflow-x:auto;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:none;width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;border:0;background:none;font-size:12px;color:var(--fg-2)}
.story .ring{position:relative;display:block}
.story .ring .av{width:50px;height:50px;font-size:17px}
.story-n{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.story.fresh .story-n{color:var(--fg);font-weight:600}
.plus{position:absolute;right:-3px;bottom:-3px;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;border:2px solid var(--surface);background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:700;line-height:1}

.list-body{overflow-y:auto;min-height:0;padding-bottom:88px}
.list-body.is-feed{padding:0;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:13px;row-gap:1px;align-items:center;width:100%;padding:10px 16px;border:0;background:none;text-align:left}
button.row:hover{background:var(--surface-2)}
.row.active{background:var(--surface-2)}
.row>.av{grid-row:1/3}
.row-name{font-weight:600;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-name.missed{color:var(--danger)}
.row-time{font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row.unread .row-time{color:var(--accent-strong);font-weight:700}
.row-prev{grid-column:2;display:flex;align-items:center;gap:4px;min-width:0;color:var(--fg-2);font-size:14px}
.row-prev>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row-prev .typing-t{color:var(--accent-strong);font-weight:500}
.row-prev .ic{width:15px;height:15px}
.row-tags{grid-column:3;display:flex;align-items:center;justify-content:flex-end;gap:6px;color:var(--fg-2)}
.row-tags .ic{width:15px;height:15px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.row .ib{grid-row:1/3;grid-column:3;color:var(--accent-strong)}
.sec,.lbl{font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2)}
.sec{padding:16px 16px 6px}
.empty{padding:36px 24px;text-align:center;color:var(--fg-2)}

.av{display:grid;place-items:center;width:48px;height:48px;flex:none;border-radius:50%;background:hsl(var(--h,150) 36% 40%);color:#fff;font-weight:600;font-size:17px;letter-spacing:.01em}
.av.sm{width:38px;height:38px;font-size:14px}
.av.lg{width:92px;height:92px;font-size:32px}
.av .ic{width:46%;height:46%}
.ring{padding:3px;border-radius:50%;border:2px solid var(--accent-line)}
.ring.seen{border-color:var(--line)}

.fab{position:absolute;right:18px;bottom:20px;display:grid;place-items:center;width:56px;height:56px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 16px var(--shadow)}
.fab:hover{background:var(--accent-hover)}
.fab .ic{width:25px;height:25px}

/* ---------- lives ---------- */
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}
.live{position:relative;height:100%;min-height:430px;scroll-snap-align:start;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto auto;gap:10px;padding:14px 16px;color:#fff;background:radial-gradient(130% 75% at 50% 18%,hsl(var(--h) 52% 34%),hsl(var(--h) 58% 12%))}
.live-top{grid-column:1/3;display:flex;align-items:center;gap:10px;min-width:0}
.live-top .av{border:2px solid rgba(255,255,255,.7)}
.live-host{flex:1;min-width:0;display:flex;flex-direction:column}
.live-host b,.live-host small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-host small{opacity:.8}
.live-badge{padding:3px 8px;border-radius:6px;background:var(--live);color:#fff;font-size:11px;font-weight:700;letter-spacing:.06em;white-space:nowrap}
.live-badge.sim{background:rgba(255,255,255,.22)}
.live-view{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;background:rgba(0,0,0,.3);font-size:12px;font-variant-numeric:tabular-nums}
.live-view .ic{width:14px;height:14px}
.live-stage{display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
.live-subject{align-self:flex-start;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.18);font-size:12.5px;font-weight:600}
.live-stage h2{margin:0;font-family:var(--font-display);font-size:25px;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.board{padding:12px 14px;border:1px solid rgba(255,255,255,.3);border-radius:12px;background:rgba(255,255,255,.12);font-size:16px;line-height:1.4}
.live-note{font-size:12px;opacity:.75}
.live-side{grid-column:2;grid-row:2/4;align-self:end;display:flex;flex-direction:column;gap:12px}
.live-side button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;border:0;background:none;color:#fff;font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}
.live-side .rb{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.32)}
.live-side .rb.g{background:var(--brand-2);color:#201300;font-family:var(--font-display);font-size:22px;font-weight:700}
.live-comments{grid-column:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;min-height:74px;font-size:13.5px}
.live-comments p{margin:0;align-self:flex-start;max-width:100%;padding:4px 10px;border-radius:12px;background:rgba(0,0,0,.3);overflow-wrap:anywhere}
.live-comments b{opacity:.8;font-weight:600;margin-right:5px}
.live-form{grid-column:1/3;display:flex;gap:8px}
.live-form input{flex:1;min-width:0;height:40px;padding:0 14px;border:1px solid rgba(255,255,255,.35);border-radius:20px;background:rgba(0,0,0,.28);color:#fff;outline:none}
.live-form input::placeholder{color:rgba(255,255,255,.75)}
.live-form input:focus{border-color:#fff}
.live-form button{display:grid;place-items:center;width:40px;height:40px;flex:none;border:0;border-radius:50%;background:#fff;color:#12241c}
.live-form .ic{fill:currentColor;stroke:none;width:19px;height:19px}
.live-end{align-self:flex-start;padding:7px 14px;border:1px solid rgba(255,255,255,.6);border-radius:18px;background:none;color:#fff;font-weight:600}

.gen{display:flex;flex-direction:column;gap:16px;padding:6px 16px 24px}
.gen-hero{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:16px;background:var(--brand-2-soft);color:var(--brand-2-ink)}
.gen-mark{display:grid;place-items:center;width:48px;height:48px;flex:none;border-radius:14px;background:var(--brand-2);color:#201300;font-family:var(--font-display);font-size:28px;font-weight:700}
.gen-hero b{font-family:var(--font-display);font-size:20px}
.gen-hero p{margin:4px 0 0;font-size:14px}
.gen-pts{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 16px;border:1px solid var(--line);border-radius:14px}
.gen-pts b{font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.gen .sec{padding:4px 0 0}
.gen .row{padding-inline:0}
.score-t{font-weight:700;font-variant-numeric:tabular-nums}
.quiz-q{margin:0;font-family:var(--font-display);font-size:20px;line-height:1.25;color:var(--fg);text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.opt:not(:disabled):hover{background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--accent-line);background:var(--accent-soft);font-weight:600}
.opt.ko{border-color:var(--danger);color:var(--danger)}
.score{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px}
.score b{font-family:var(--font-display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--fg-2)}

/* ---------- fundraising ---------- */
.funds{display:flex;flex-direction:column;gap:12px;padding:4px 16px 24px}
.note-box{padding:9px 12px;border-radius:10px;background:var(--notice);color:var(--notice-fg);font-size:13px}
.fund{display:flex;flex-direction:column;gap:9px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:left}
button.fund:hover{background:var(--surface-2)}
.fund-top{display:flex;align-items:center;gap:10px;min-width:0}
.fund-org{flex:1;min-width:0;display:flex;flex-direction:column}
.fund-org b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agree{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--accent-strong);font-weight:600}
.agree .ic{width:13px;height:13px;stroke-width:2.6}
.fund-title{margin:0;font-family:var(--font-display);font-size:18px;font-weight:600;line-height:1.2;color:var(--fg)}
.bar{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--brand-2);transition:width .5s}
.fund-nums{font-size:14px;color:var(--fg-2);font-variant-numeric:tabular-nums}
.fund-nums b{color:var(--fg);font-size:16px}
.fund-sub{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-2)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none}
.fd-big{font-family:var(--font-display);font-size:34px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--fg)}
.fd-live{display:flex;flex-direction:column;gap:8px}
.fd-feed,.fd-use{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.fd-feed li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.fd-feed li span:last-child{color:var(--fg-2);white-space:nowrap}
.fd-feed b,.fd-use b{font-variant-numeric:tabular-nums}
.fd-use li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.fd-use small{flex-basis:100%;color:var(--accent-strong);font-weight:600}

/* settings */
.set{display:flex;flex-direction:column;gap:22px;padding:8px 16px 24px}
.set-profile{display:flex;align-items:center;gap:14px}
.set-profile .av{width:64px;height:64px;font-size:23px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.set-block h2{margin:0;font-family:var(--font-body);font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2)}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--fg);outline-offset:-1px}
.set-block{display:flex;flex-direction:column;gap:10px}
.set-block p{margin:0;color:var(--fg-2);font-size:14px;max-width:60ch}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--c)}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;padding:10px 18px;border:0;border-radius:22px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:hover{background:var(--accent-hover)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn.sm .ic{width:18px;height:18px}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:none;border:1px solid var(--danger);color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- chat pane ---------- */
.pane-chat{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--chat-bg,var(--wp-0))}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;background:var(--surface-2);color:var(--fg-2);text-align:center}
.chat-empty .logo{width:72px;height:72px}
.chat-empty b{font-family:var(--font-display);font-size:30px;color:var(--accent-strong);letter-spacing:-.02em}
.chat-head{display:flex;align-items:center;gap:2px;padding:8px 10px 8px 8px;background:var(--surface);border-bottom:1px solid var(--line);min-height:60px}
.chat-head .back{display:none}
.chat-id{flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:4px 8px;border:0;border-radius:10px;background:none;text-align:left}
.chat-id:hover{background:var(--surface-2)}
.chat-id-t{min-width:0;display:flex;flex-direction:column}
.chat-id-t b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-id-t small{font-size:12.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-id-t small.on{color:var(--accent-strong)}

.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:10px max(16px,5%) 14px;background-color:var(--chat-bg,var(--wp-0));background-image:radial-gradient(var(--chat-dot) 1.3px,transparent 1.6px),radial-gradient(var(--chat-dot) 1.3px,transparent 1.6px);background-size:26px 26px;background-position:0 0,13px 13px}
.notice{align-self:center;max-width:440px;margin:4px 0 6px;padding:7px 12px;border-radius:9px;background:var(--notice);color:var(--notice-fg);font-size:12.5px;text-align:center}
.day,.sys{align-self:center;margin:12px 0 4px;padding:4px 11px;border-radius:8px;background:var(--surface);color:var(--fg-2);font-size:12px;box-shadow:0 1px 1px var(--shadow-soft)}
.day::first-letter{text-transform:uppercase}
.sys{max-width:80%;text-align:center}
.msg{display:flex;flex-direction:column;align-items:flex-start;margin-top:2px}
.msg.first{margin-top:9px}
.msg.out{align-items:flex-end}
.bubble{position:relative;max-width:min(80%,540px);padding:6px 9px 7px;border-radius:9px;background:var(--bubble-in);box-shadow:0 1px 1px var(--shadow-soft);overflow-wrap:anywhere;font-size:15px}
.msg.out .bubble{background:var(--bubble-out)}
.msg.first .bubble::before{content:"";position:absolute;top:0;width:9px;height:12px;background:inherit}
.msg.in.first .bubble{border-top-left-radius:0}
.msg.in.first .bubble::before{left:-8px;clip-path:polygon(100% 0,0 0,100% 100%)}
.msg.out.first .bubble{border-top-right-radius:0}
.msg.out.first .bubble::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.who{display:block;margin-bottom:1px;font-size:13px;font-weight:700;color:hsl(var(--h) 55% 38%)}
.txt{white-space:pre-wrap}
.txt.gone{font-style:italic;color:var(--fg-2)}
.tr{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px;margin-top:4px;padding-top:4px;border-top:1px solid var(--quote);font-size:12.5px;color:var(--fg-2)}
.tr .ic{width:13px;height:13px;align-self:center}
.tr button{padding:0;border:0;background:none;color:var(--accent-strong);font-weight:600;text-decoration:underline}
.tr-txt{flex-basis:100%;font-style:italic;white-space:pre-wrap}
.meta{float:right;display:flex;align-items:center;gap:3px;margin:7px 0 -3px 12px;font-size:11px;color:var(--fg-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.tick{width:17px;height:11px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tick.read{color:var(--tick-read)}
.photo{display:block;max-width:100%;max-height:320px;border-radius:7px;margin-bottom:4px}
.quote{display:block;margin-bottom:4px;padding:4px 9px;border-left:3px solid var(--accent-line);border-radius:6px;background:var(--quote);font-size:13px}
.quote b{display:block;color:var(--accent-strong);font-weight:600}
.quote span{display:block;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg-more{position:absolute;top:3px;right:3px;display:grid;place-items:center;width:24px;height:24px;border:0;border-radius:50%;background:inherit;color:var(--fg-2);opacity:0}
.msg-more .ic{width:17px;height:17px}
.bubble:hover .msg-more,.msg-more:focus-visible{opacity:1}
@media (hover:none){ .msg-more{display:none} }
.reaction{margin:-5px 8px 0;padding:1px 7px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:13px;z-index:1}
.dots{display:flex;gap:4px;padding:6px 2px 4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--fg-2);animation:bob 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}

.replybar{display:flex;align-items:center;gap:8px;padding:8px 10px 0 14px;background:var(--surface)}
.replybar .quote{flex:1;min-width:0;margin:0}
.emoji-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:2px;max-height:168px;overflow-y:auto;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line)}
.emoji-panel button{height:40px;border:0;border-radius:8px;background:none;font-size:23px;line-height:1}
.emoji-panel button:hover{background:var(--surface-2)}
.composer{display:flex;align-items:flex-end;gap:4px;padding:8px 10px;background:var(--surface)}
.composer textarea{flex:1;min-width:0;height:40px;max-height:120px;padding:9px 14px;border:0;border-radius:20px;background:var(--surface-2);resize:none;outline:none;line-height:1.45}
.composer textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
.send{display:grid;place-items:center;width:42px;height:42px;flex:none;margin-left:4px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.send:disabled{background:var(--surface-2);color:var(--fg-2);cursor:default}
.send .ic{fill:currentColor;stroke:none;width:21px;height:21px}

.send.mic .ic{fill:none;stroke:currentColor}
.lang-btn{display:flex;align-items:center;gap:3px;height:40px;padding:0 7px;flex:none;border:0;border-radius:20px;background:none;color:var(--accent-strong);font-size:12.5px;font-weight:700;letter-spacing:.03em}
.lang-btn:hover{background:var(--surface-2)}
.lang-btn .ic{width:18px;height:18px}
.composer.typing .hide-typing{display:none}
.voice{display:block;margin-bottom:2px}
.voice audio{display:block;width:240px;max-width:100%;height:38px}
.voice.off{display:flex;align-items:center;gap:6px;color:var(--fg-2);font-size:13.5px}
.voice.off .ic{width:18px;height:18px}
.row.lang-row{grid-template-columns:minmax(0,1fr) auto;padding-block:9px}
.lang-row .ql{grid-column:2;grid-row:1/3;align-self:center}
.lang-src{grid-column:1;font-size:12px;color:var(--fg-2)}
.row.lang-row.off .row-name{color:var(--fg-2);font-weight:500}
.lang-note{margin:0;padding:0 18px 8px;font-size:13px;color:var(--fg-2)}
.row.lang-row[aria-pressed="true"]{background:var(--accent-soft)}
.ql{padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ql.a{background:var(--accent-soft);color:var(--accent-strong)}
.ql.b{background:var(--brand-2-soft);color:var(--brand-2-ink)}
.ql.c{background:var(--surface-2);color:var(--fg-2)}
.ql.v{background:none;border:1px solid var(--line);color:var(--fg-2)}

/* ---------- overlays ---------- */
#layer{position:absolute;inset:0;z-index:20;pointer-events:none}
#layer>*{pointer-events:auto}
.scrim{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:var(--overlay)}
.sheet{width:min(430px,100%);max-height:88%;overflow-y:auto;border-radius:16px;background:var(--surface);box-shadow:0 18px 50px var(--shadow)}
.sheet-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;padding:12px 10px 10px 18px;background:var(--surface)}
.sheet-head h2{flex:1;min-width:0;margin:0;font-family:var(--font-display);font-size:20px;letter-spacing:-.01em;overflow-wrap:anywhere}
.sheet-body{display:flex;flex-direction:column;gap:14px;padding:4px 18px 18px}
.sheet-body p{margin:0;color:var(--fg-2)}
.sheet-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}
.menu{display:flex;flex-direction:column;padding:6px 0 10px}
.menu button{display:flex;align-items:center;gap:14px;padding:12px 20px;border:0;background:none;text-align:left;font-size:15.5px}
.menu button:hover{background:var(--surface-2)}
.menu button.danger{color:var(--danger)}
.menu .ic{color:var(--fg-2)}
.menu button.danger .ic{color:var(--danger)}
.react-row{display:flex;justify-content:space-between;gap:4px;padding:12px 14px 6px}
.react-row button{width:44px;height:44px;border:0;border-radius:50%;background:var(--surface-2);font-size:22px;line-height:1}
.react-row button[aria-pressed="true"]{background:var(--accent-soft);outline:2px solid var(--accent-line)}
.pick{display:flex;align-items:center;gap:13px;padding:8px 18px}
.pick input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.pick span:last-child{min-width:0;overflow-wrap:anywhere}
.err{color:var(--danger);font-size:13.5px}
.info-top{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 18px 14px;text-align:center}
.info-top b{font-size:21px;font-family:var(--font-display)}
.info-top span{color:var(--fg-2)}
.kv{display:flex;flex-direction:column;gap:2px;padding:10px 18px;border-top:1px solid var(--line)}
.kv small{color:var(--fg-2);font-size:12.5px}

.sv{position:absolute;inset:0;display:flex;flex-direction:column;background:hsl(var(--h) 25% 10%);color:#fff}
.sv-bars{display:flex;gap:4px;padding:10px 12px 0}
.sv-bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.35);overflow:hidden}
.sv-bars b{display:block;height:100%;width:0;background:#fff}
.sv-bars .done b{width:100%}
.sv-bars .run b{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.sv-head{position:relative;z-index:2;display:flex;align-items:center;gap:8px;padding:10px 8px 10px 14px}
.sv-head div{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:3px}
.sv-head small{opacity:.8}
.sv-head .ib,.sv-head .ib:hover{color:#fff;background:rgba(255,255,255,.14)}
.sv-text{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;margin:0;padding:24px max(24px,10%);font-family:var(--font-display);font-size:clamp(24px,5vw,38px);font-weight:600;line-height:1.2;text-align:center;text-wrap:balance}
.sv-text small{font-family:var(--font-body);font-size:14px;font-weight:400;opacity:.85}
.sv-nav{position:absolute;top:70px;bottom:0;width:38%;border:0;background:none}
.sv-nav.prev{left:0}.sv-nav.next{right:0}

.call{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:16px;padding:40px 24px 36px;background:var(--call-bg);color:var(--call-fg);text-align:center;overflow-y:auto}
.call-top{display:flex;flex-direction:column;align-items:center;gap:10px}
.call-top b{font-family:var(--font-display);font-size:28px}
.call-top span{color:var(--call-fg-2);font-variant-numeric:tabular-nums}
.call-note{max-width:340px;padding:6px 12px;border-radius:9px;background:var(--call-btn);color:var(--call-fg-2);font-size:12.5px}
.call .av.lg{width:112px;height:112px;font-size:40px}
.call-sub{display:flex;flex-direction:column;gap:4px;width:min(440px,100%);min-height:96px;padding:12px 16px;border-radius:14px;background:var(--call-btn);text-align:left}
.call-sub small{color:var(--call-fg-2);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.call-sub span{color:var(--call-fg-2);font-style:italic;font-size:14px}
.call-sub b{font-size:18px;font-weight:600}
.call-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.call-btns button{display:grid;place-items:center;width:58px;height:58px;border:0;border-radius:50%;background:var(--call-btn);color:var(--call-fg)}
.call-btns button[aria-pressed="true"]{background:var(--call-fg);color:var(--call-bg)}
.call-btns .hang{background:#d93a3a;color:#fff}
.call-btns .hang .ic{transform:rotate(135deg)}

.toast{position:absolute;left:50%;bottom:92px;z-index:30;transform:translateX(-50%);max-width:calc(100% - 32px);padding:9px 16px;border-radius:20px;background:var(--fg);color:var(--surface);font-size:14px;box-shadow:0 6px 18px var(--shadow)}

/* ---------- v5: profile, stories, memories, composer, location ---------- */
.av.xs{width:34px;height:34px;font-size:13px}
.me-btn{display:grid;place-items:center;padding:0;border:0;border-radius:50%;background:none}
.tab-set{margin-top:auto}
.seg button{display:flex;align-items:center;justify-content:center;gap:5px}
.seg .ic{width:16px;height:16px}
.row>.btn{grid-row:1/3;grid-column:3}
.hint{margin:0;font-size:12.5px;color:var(--fg-2)}

.stories{user-select:none;-webkit-user-select:none}
.story-n{line-height:1.2;text-align:center}
.ring.priv{border-color:var(--brand-2)}
.lock{position:absolute;left:-3px;bottom:-3px;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);background:var(--fg);color:var(--surface)}
.lock .ic{width:11px;height:11px;stroke-width:2.4}
.story.lifted .ring{box-shadow:0 0 0 3px var(--accent-line)}
.story.dragging{opacity:.65;transform:scale(1.08)}
.stories.sorting{cursor:grabbing}

.anniv{display:flex;gap:12px;align-items:center;margin:4px 16px 12px;padding:12px;border-radius:16px;background:var(--accent-soft)}
.anniv-th{position:relative;display:grid;place-items:center;width:64px;height:64px;flex:none;border-radius:12px;overflow:hidden;font-size:30px;background:linear-gradient(150deg,hsl(var(--h) 60% 52%),hsl(calc(var(--h) + 40) 60% 28%))}
.anniv-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.anniv-t{min-width:0;display:flex;flex-direction:column;gap:3px}
.anniv-t span{font-size:13.5px;color:var(--fg-2)}
.anniv-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px}
.anniv.compact .anniv-th{width:52px;height:52px;font-size:24px}

.mem-wrap{display:flex;flex-direction:column;padding:0 16px 24px}
.mem-y{margin:16px 0 8px;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-2)}
.mem-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mem-t{position:relative;display:grid;place-items:center;max-width:100%;aspect-ratio:3/4;padding:0;border:0;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,hsl(var(--h) 60% 52%),hsl(calc(var(--h) + 40) 60% 28%))}
.mem-t img,.mem-big img,.mem-big video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mt-e{font-size:34px;line-height:1}
.mem-play{position:absolute;top:6px;left:6px;display:flex;align-items:center;gap:4px;padding:3px 7px 3px 4px;border-radius:9px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600}
.mem-play .ic{width:13px;height:13px}
.mem-vis{position:absolute;left:6px;bottom:6px;display:flex;align-items:center;gap:3px;padding:2px 7px 2px 5px;border-radius:9px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600}
.mem-vis .ic{width:12px;height:12px}
.mem-big{position:relative;display:grid;place-items:center;max-width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:linear-gradient(150deg,hsl(var(--h) 60% 52%),hsl(calc(var(--h) + 40) 60% 28%))}
.mem-big .mt-e{font-size:72px}
.mem-big video{object-fit:contain;background:#000}

.loc{display:flex;flex-direction:column;gap:6px;width:250px;max-width:100%}
.map{display:block;width:100%;height:auto;border-radius:7px}
.map .pulse{transform-origin:120px 45px;animation:pulse 1.8s infinite ease-out}
@keyframes pulse{0%{transform:scale(.5);opacity:.5}100%{transform:scale(1.6);opacity:0}}
.loc-t{display:flex;flex-direction:column;gap:1px}
.loc-t small{color:var(--fg-2);font-size:12.5px}
.loc-t button{align-self:flex-start;margin-top:5px;padding:4px 11px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-size:13px;font-weight:600}
.share-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.share-row span{display:flex;align-items:center;gap:6px;min-width:0}
.share-row .ic{width:16px;height:16px;flex:none}
.set-picks .pick{padding-inline:0}
.invite-text{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);resize:none;font-size:14.5px}

/* story canvas: 9:16, everything sized in cqw so it scales from a thumbnail to full screen */
.stage{position:relative;width:100%;height:100%;container-type:inline-size;overflow:hidden;border-radius:14px;background:linear-gradient(160deg,hsl(var(--h) 55% 42%),hsl(calc(var(--h) + 40) 60% 22%))}
.stage.k-img,.stage.k-vid{background:#000}
.st-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.st-vbox{position:absolute;left:0;top:50%;width:100%;max-height:100%;transform:translateY(-50%);overflow:hidden;background:#000}
.st-vbox video{display:block;width:100%;height:100%}
.st-miss{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:10cqw;color:#ddd;font-size:5cqw;text-align:center}
.st-miss .ic{width:14cqw;height:14cqw}
.st-txt{position:absolute;width:86%;max-height:90%;overflow:hidden;padding:2cqw;transform:translate(-50%,-50%);line-height:1.2;white-space:pre-wrap;overflow-wrap:anywhere}
.st-txt.mv,.stk{touch-action:none;cursor:move}
.st-txt.mv{outline:1px dashed rgba(255,255,255,.45);outline-offset:1cqw;border-radius:1.5cqw}
.st-txt.over{text-shadow:0 .5cqw 2.5cqw rgba(0,0,0,.65)}
.st-txt.ph{opacity:.55}
.frame{position:absolute;inset:0;pointer-events:none}
.f-polaroid{border:4cqw solid #fff;border-bottom-width:18cqw}
.f-tamtam{border:3cqw solid #26c6da}
.f-tamtam span{position:absolute;right:3cqw;bottom:3cqw;padding:1.5cqw 3cqw;border-radius:1.5cqw;background:#26c6da;color:#fff;font:700 5cqw/1 "Bricolage Grotesque",sans-serif}
.f-cinema{border-top:16cqw solid #000;border-bottom:16cqw solid #000}
.f-coeurs{box-shadow:inset 0 0 0 2.5cqw #ff4d6d}
.f-coeurs i{position:absolute;font-style:normal;font-size:9cqw;line-height:1;transform:translate(-50%,-50%)}
.stk{position:absolute;padding:0;border:0;background:none;font-size:12cqw;line-height:1;transform:translate(-50%,-50%);cursor:pointer}

.sv-stage{flex:1;min-height:0;display:flex;justify-content:center;padding:2px 12px 10px}
.sv-box{position:relative;height:100%;max-width:100%;aspect-ratio:9/16}
.sv-box .sv-nav{top:0;bottom:0;z-index:1}
.sv-song{position:absolute;top:10px;left:10px;z-index:2;display:flex;align-items:center;gap:5px;max-width:calc(100% - 20px);padding:4px 10px 4px 8px;border-radius:14px;background:rgba(0,0,0,.6);color:#fff;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-song .ic{width:14px;height:14px}
.sv-cap{display:flex;flex-direction:column;gap:4px;padding:0 20px 16px;text-align:center}
.sv-cap p{margin:0 auto;max-width:520px;font-size:15.5px;line-height:1.4}
.sv-cap small{opacity:.8}

/* composer: a single dark studio look, whatever the app theme */
.cp{position:absolute;inset:0;display:flex;flex-direction:column;background:#0c0c0e;color:var(--fg);color-scheme:dark;
  --surface:#18181b;--surface-2:#26262b;--fg:#f4f4f5;--fg-2:#a1a1aa;--line:#34343b;--accent-soft:#0e3a40;--accent-strong:#5fdbea}
.cp-head{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
.cp-head .ib{color:var(--fg)}
.cp-aud{flex:1;max-width:280px;margin-inline:auto}
.cp-aud-note{margin:0;padding:0 16px 8px;text-align:center;font-size:12.5px;color:var(--fg-2)}
.cp-main{flex:1;min-height:0;display:flex;justify-content:center;gap:18px;padding:0 16px 16px}
.cp-stage{position:relative;flex:none;height:100%;max-width:46%;aspect-ratio:9/16}
.cp-tools{flex:1;max-width:440px;min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;background:var(--surface)}
.cp-tabs{display:flex;flex:none;gap:2px;padding:6px;overflow-x:auto;border-bottom:1px solid var(--line)}

.cp-tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.cp-panel{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:14px;overflow-y:auto}
.cp-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;border:1px solid transparent;border-radius:12px;background:var(--surface-2);color:var(--fg);font-size:12.5px;font-weight:600}
.tool[aria-pressed="true"],.fontb[aria-pressed="true"],.flt[aria-pressed="true"],.trk[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.fontb{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--fg);font-size:17px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordbar{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:10px;background:var(--surface-2)}
.wordbar button{display:grid;place-items:center;width:38px;height:34px;border:0;border-radius:8px;background:none;color:var(--fg);font:17px Georgia,serif}
.wordbar button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.wordbar .ic{width:19px;height:19px}
.wordbar .sep{width:1px;margin:4px;background:var(--line)}
.field input[type="range"]{padding:0;border:0;background:none;accent-color:var(--accent)}
.sw.sm{width:34px;height:34px;border-radius:50%}
.flts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.flt{display:flex;flex-direction:column;gap:4px;padding:0 0 6px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);color:var(--fg);font-size:11.5px;font-weight:600}
.flt img{width:100%;aspect-ratio:1;object-fit:cover}
.stks{display:flex;flex-wrap:wrap;gap:6px}
.stks button{width:44px;height:44px;border:0;border-radius:10px;background:var(--surface-2);font-size:24px}
.trk{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--fg);text-align:left}
.trk>span{display:flex;flex-direction:column;min-width:0}
.trk small{color:var(--fg-2)}

.mlist{display:flex;flex-direction:column;gap:4px;padding:0 10px}
.mrow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--surface);user-select:none;-webkit-user-select:none}
.mrow.dragging{background:var(--surface-2);box-shadow:0 8px 20px var(--shadow)}
.grip{display:grid;place-items:center;width:30px;height:44px;flex:none;color:var(--fg-2);cursor:grab;touch-action:none}
.mthumb{position:relative;width:40px;height:71px;flex:none;border-radius:8px;overflow:hidden}
.mthumb .stage{border-radius:8px}
.mt{flex:1;min-width:0;display:flex;flex-direction:column}
.mt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt small{color:var(--fg-2)}

@media (max-width:859px){
  .tab-set{display:none}
  .cp-main{flex-direction:column;align-items:center;gap:10px;padding:0 12px 12px}
  .cp-stage{height:44%;max-width:100%}
  .cp-tools{width:100%;max-width:none;flex:1}
}
@media (prefers-reduced-motion:reduce){ .map .pulse{animation:none} }


/* ---------- v6: silhouettes, sign-up, + button, movable text ---------- */
.av.sil{background:#fff;overflow:hidden}

.av.sil img{width:100%;height:100%;object-fit:cover}

.onb-av{display:grid;place-items:center}
.onb-av .av{width:104px;height:104px;box-shadow:0 0 0 3px var(--accent-line)}
.onb-ph{display:flex;flex-wrap:wrap;gap:8px}
.onb-card .btn[type="submit"]{align-self:stretch;justify-content:center;padding-block:12px;font-size:16px}

.ring{padding:2px;border-width:1px;border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

.onb{display:flex;flex-direction:column}

.auth{position:relative;display:flex;align-items:center;justify-content:center;width:100%;padding:13px 16px 13px 48px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);font-size:16px;font-weight:600}

.acc-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.acc{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--fg);text-align:left}
.acc:last-child{border-bottom:0}
.acc:hover{background:var(--surface-2)}
.acc>span:last-child{display:flex;flex-direction:column;min-width:0}

.acc-ic{background:var(--surface-2);color:var(--fg-2)}

.pick.chk{padding:0;align-items:flex-start}

#legalBox{position:absolute;inset:0;z-index:40;pointer-events:none}
#legalBox>*{pointer-events:auto}
.legal{width:min(660px,100%)}
.legal-text{display:flex;flex-direction:column;max-width:68ch;font-size:14.5px;line-height:1.55}

.rs{display:flex;flex-direction:column;margin:0;padding:0;border:0}
.rs .pick{padding:6px 0}
.set-block p .ic{display:inline-block;width:16px;height:16px;margin-right:5px;vertical-align:-3px}

.poll{display:flex;flex-direction:column;gap:6px;min-width:240px;padding:2px 0 4px}
.poll small{color:var(--fg-2);margin-top:-4px}
.po{position:relative;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:inherit;text-align:left;overflow:hidden}
.po i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);z-index:0;transition:width .3s}
.po span{position:relative;z-index:1}
.po.on{border-color:var(--accent);font-weight:600}
.po-n{color:var(--fg-2)}
.evc{display:flex;flex-direction:column;gap:6px;min-width:240px;padding:2px 0 4px}
.evc-top{display:flex;gap:10px;align-items:flex-start}
.evc-top>svg{flex:none;width:30px;height:30px;color:#e8590c}
.evc-top>span{display:flex;flex-direction:column}
.evc-top small{color:var(--fg-2);text-transform:none}
.evc-n{font-size:14px}
.evc-b{display:flex;flex-wrap:wrap;gap:5px}
.ev-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ai-tag{display:block;font-size:11.5px;color:var(--fg-2);margin-top:2px}
.flame{font-size:13px;font-weight:600;color:#e8590c;white-space:nowrap}
/* ---------- v14 ---------- */
.call-ppl{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 16px;max-width:360px}
.cp-p{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.cp-p .av{width:56px;height:56px}
.cp-p small{font-size:12px;color:var(--call-fg-2);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp-p.ring .av{animation:cpPulse 1.2s ease-in-out infinite;opacity:.75}
@keyframes cpPulse{50%{box-shadow:0 0 0 6px rgba(255,255,255,.18)}}
@media (prefers-reduced-motion:reduce){.cp-p.ring .av{animation:none}}
.call-add{position:absolute;left:0;right:0;bottom:0;max-height:70%;display:flex;flex-direction:column;border-radius:20px 20px 0 0;background:var(--surface);color:var(--fg);text-align:left;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.call-add-h{display:flex;flex-direction:column;gap:2px;padding:16px 18px 8px}
.call-add-h span{font-size:13px;color:var(--fg-2)}
.call-add-l{flex:1;overflow-y:auto;padding:0 6px}
.call-add-b{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 16px;border-top:1px solid var(--line)}
.st-muted{opacity:.42}
.st-sep{flex:none;align-self:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-2);padding:0 2px;border-left:1px solid var(--line)}
.sv-pop{position:absolute;top:58px;right:12px;z-index:5;display:flex;flex-direction:column;min-width:240px;padding:6px;border-radius:14px;background:var(--surface);color:var(--fg);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.sv-pop button{display:flex;align-items:center;gap:10px;padding:11px 12px;border:0;border-radius:10px;background:none;color:inherit;font:inherit;text-align:left}
.sv-pop button:hover{background:var(--surface-2)}
.sv-pop svg{width:18px;height:18px}

const pad = n => String(n).padStart(2, '0');
const hm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayStart = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dayDiff = ts => Math.round((dayStart(Date.now()) - dayStart(ts)) / DAY);
const WEEK = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
const dmy = ts => { const d = new Date(ts); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
function listTime(ts) { const n = dayDiff(ts); return n <= 0 ? hm(ts) : n === 1 ? 'Hier' : n < 7 ? WEEK[new Date(ts).getDay()] : dmy(ts); }
function dayLabel(ts) { const n = dayDiff(ts); return n <= 0 ? 'Aujourd’hui' : n === 1 ? 'Hier' : new Date(ts).toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'}); }
function whenLabel(ts) { const n = dayDiff(ts); return (n <= 0 ? 'Aujourd’hui' : n === 1 ? 'Hier' : dmy(ts)) + ', ' + hm(ts); }
function seenLabel(ts) { const n = dayDiff(ts); return 'vu ' + (n <= 0 ? 'aujourd’hui' : n === 1 ? 'hier' : 'le ' + dmy(ts)) + ' à ' + hm(ts); }

/* ---------- drag to reorder (mouse: drag; touch: hold then drag, or use a handle) ---------- */
function sortable(box, sel, o) {
  let st = null, suppress = false;
  box.addEventListener('pointerdown', e => {
    const el = e.target.closest(sel); if (!el || !box.contains(el)) return;
    if (o.handle && !e.target.closest(o.handle)) return;
    suppress = false;
    st = {el, x: e.clientX, y: e.clientY, id: e.pointerId, drag: false, armed: e.pointerType === 'mouse' || !!o.handle};
    if (!st.armed) st.t = setTimeout(() => { if (st) { st.armed = true; st.el.classList.add('lifted'); if (navigator.vibrate) navigator.vibrate(15); } }, 300);
  });
  box.addEventListener('pointermove', e => {
    if (!st) return;
    const d = Math.hypot(e.clientX - st.x, e.clientY - st.y);
    if (!st.armed) { if (d > 8) { clearTimeout(st.t); st = null; } return; }
    if (!st.drag) { if (d < 6) return; st.drag = true; st.el.classList.add('dragging'); box.classList.add('sorting'); try { box.setPointerCapture(st.id); } catch (err) {} }
    e.preventDefault();
    const over = document.elementFromPoint(e.clientX, e.clientY), tgt = over && over.closest(sel);
    if (tgt && tgt !== st.el && box.contains(tgt)) {
      const r = tgt.getBoundingClientRect(), after = o.axis === 'y' ? e.clientY > r.top + r.height / 2 : e.clientX > r.left + r.width / 2;
      tgt.parentNode.insertBefore(st.el, after ? tgt.nextSibling : tgt);
    }
  });
  const finish = () => {
    if (!st) return;
    clearTimeout(st.t); const was = st.drag;
    st.el.classList.remove('dragging', 'lifted'); box.classList.remove('sorting'); st = null;
    if (was) { suppress = true; setTimeout(() => { suppress = false; }, 80); o.onDrop([...box.querySelectorAll(sel)].map(x => x.dataset.key)); }
  };
  box.addEventListener('pointerup', finish); box.addEventListener('pointercancel', finish);
  box.addEventListener('touchmove', e => { if (st && st.armed) e.preventDefault(); }, {passive: false});
  box.addEventListener('contextmenu', e => { if (st) e.preventDefault(); });
  box.addEventListener('click', e => { if (suppress) { suppress = false; e.preventDefault(); e.stopPropagation(); } }, true);
}

/* ---------- extra input / change handling ---------- */
var extraInput = function (t) {
  const c = ui.comp;
  if (c && t.id === 'cpText') { c.text = t.value; refreshStage(); return true; }
  if (c && t.id === 'cpCap') { c.caption = t.value; return true; }
  if (c && t.id === 'cpSize') { c.font.size = +t.value; $('#cpSizeV').textContent = t.value; refreshStage(); return true; }
  if (c && t.id === 'cpZoom') { c.vzoom = +t.value; $('#cpZoomV').textContent = Math.round(c.vzoom * 100) + ' %'; refreshStage(); return true; }
  if (t.id === 'fq') {
    const q = t.value.trim().toLowerCase(); let k = 0;
    layer.querySelectorAll('.fr-row').forEach(r => { r.hidden = !!q && !r.dataset.n.includes(q); if (!r.hidden) k++; });
    $('#frEmpty').hidden = k > 0; return true;
  }
  if (t.id === 'mcap') { const m = (S.memories || []).find(x => x.id === ui.memId); if (m) { m.caption = t.value; save(); if (ui.tab === 'mem') renderListBody(); } return true; }
  return false;
};
var extraChange = function (t) {
  const c = ui.comp;
  if (t.id === 'cpPhoto' || t.id === 'cpCam') {
    const f = t.files[0]; t.value = ''; if (!f || !c) return true;
    readImage(f, 1280).then(img => { if (ui.comp !== c) return; Object.assign(c, {kind: 'img', img, filter: 'none', stickers: [], frame: 'none', tab: 'filter'}); renderComp(); }, () => toast('Choisissez un fichier image.'));
    return true;
  }
  if (t.id === 'cpVid') {
    const f = t.files[0]; t.value = ''; if (!f || !c) return true;
    if (!/^video\//.test(f.type)) { toast('Choisissez un fichier vidéo.'); return true; }
    Object.assign(c, {kind: 'vid', vurl: URL.createObjectURL(f), tab: 'format'}); renderComp(); return true;
  }
  if (t.id === 'cpAudio') {
    const f = t.files[0]; t.value = ''; if (!f || !c) return true;
    if (!/^audio\//.test(f.type) && !/\.(mp3|m4a|wav|ogg|aac)$/i.test(f.name)) { toast('Choisissez un fichier audio.'); return true; }
    c.song = {name: f.name.replace(/\.[^.]+$/, ''), url: URL.createObjectURL(f)}; Music.play(c.song); renderComp(); return true;
  }
  if (t.id === 'memIn') { const fs = [...t.files]; t.value = ''; if (fs.length) addMemories(fs); return true; }
  if (t.name === 'memp') { const m = (S.memories || []).find(x => x.id === ui.memId); if (m) { m.people = [...layer.querySelectorAll('input[name="memp"]:checked')].map(i => i.value); save(); } return true; }
  if (t.name === 'close') { S.close = [...listBody.querySelectorAll('input[name="close"]:checked')].map(i => i.value); save(); return true; }
  return false;
};

function chatRows() {
  const q = ui.q.trim().toLowerCase();
  let list = S.chats.filter(c => c.messages.length || c.id === ui.chatId);
  if (ui.filter === 'unread') list = list.filter(c => c.unread > 0);
  if (ui.filter === 'fav') list = list.filter(c => c.fav);
  if (ui.filter === 'groups') list = list.filter(c => c.type === 'group');
  if (q) list = list.filter(c => chatName(c).toLowerCase().includes(q) || c.messages.some(m => !m.deleted && (m.text || '').toLowerCase().includes(q)));
  list.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || lastTs(b) - lastTs(a));
  if (!list.length) {
    const why = q ? 'Aucune discussion ne correspond à « ' + esc(ui.q.trim()) + ' ».'

    return `<p class="empty">${why}</p>`;
  }
  return list.map(c => {
    const m = c.messages[c.messages.length - 1];
    let prev = '<span>Aucun message</span>';

/* ---------- sending and simulated replies ---------- */
function replyFor(text) {
  const t = (text || '').toLowerCase();
  if (!text) return pick(['Belle photo ! 📸', 'Merci pour la photo 😍', 'Bien reçu 👍']);
  if (/(^|\s)(bonjour|salut|coucou|hello|bonsoir)/.test(t)) return pick(['Salut ! Ça va ?', 'Coucou 👋 Quoi de neuf ?', 'Bonjour ! Comment tu vas ?']);
  if (/merci/.test(t)) return pick(['Avec plaisir 🙏', 'De rien !', 'Pas de souci 😊']);
  if (/\?\s*$/.test(t)) return pick(['Oui, bien sûr.', 'Bonne question, je te redis ça dans la journée.', 'Je pense que oui, je vérifie.', 'Pas encore, mais bientôt.']);
  return pick(['D’accord, c’est noté 👍', 'Super, merci pour l’info !', 'Ça marche.', 'Parfait, on fait comme ça.', 'Haha, bien vu 😄', 'Ok, je te tiens au courant.']);
}
function setStatus(cid, mid, st) {
  const c = chatOf(cid), m = c && c.messages.find(x => x.id === mid);
  if (m && !m.deleted) { m.status = st; refresh(cid); }
}
function receive(cid, from, text, orig, lang) {
  const c = chatOf(cid); if (!c) return;
  const m = {id: uid(), from, text, ts: Date.now()};
  if (orig) { m.orig = orig; m.lang = lang; }
  c.messages.push(m);
  if (ui.chatId !== cid) c.unread = (c.unread || 0) + 1;
  refresh(cid);
}
function send(text, img, extra) {
  const c = chatOf(ui.chatId); if (!c) return;
  const f = foreignOf(c), translate = !!(f && c.tr !== false && text);
  const m = {id: uid(), from: 'me', text: text || '', ts: Date.now(), status: 'sent'};
  if (img) m.img = img;
  if (extra) Object.assign(m, extra);
  if (translate) { m.trLang = f.lang; m.trState = 'pending'; }
  if (ui.replyTo) { m.replyTo = ui.replyTo; ui.replyTo = null; renderReplyBar(); }
  c.messages.push(m);
  refresh(c.id);
  const cid = c.id, mid = m.id;
  const from = c.type === 'group' ? pick(c.members.filter(id => S.contacts[id])) : c.contactId;
  setTimeout(() => setStatus(cid, mid, 'delivered'), 700);
  setTimeout(() => setStatus(cid, mid, 'read'), 1700);
  const job = translate ? aiExchange(c, text) : Promise.resolve(null);
  if (translate) job.then(r => {
    const cc = chatOf(cid), mm = cc && cc.messages.find(x => x.id === mid); if (!mm) return;
    if (r) { mm.tr = r.translation; mm.trState = 'done'; } else mm.trState = 'off';
    refresh(cid);
  });
  if (!from) return;
  clearTimeout(replyTimers[cid]);
  replyTimers[cid] = setTimeout(() => {
    if (!chatOf(cid)) return;
    typing[cid] = from; refresh(cid);
    Promise.all([job, wait(1300 + Math.random() * 1200)]).then(([r]) => {
      const cc = chatOf(cid);
      if (!cc || typing[cid] !== from) return;
      delete typing[cid];
      if (r) return receive(cid, from, r.reply_fr, r.reply, f.lang);
      if (f && f.lang === 'en') { const s = pick(EN_REPLIES); return cc.tr !== false ? receive(cid, from, s.fr, s.orig, 'en') : receive(cid, from, s.orig); }
      receive(cid, from, extra && extra.voice ? pick(['Bien reçu ton vocal 🎧', 'Je l’écoute et je te réponds.', 'Merci pour le vocal 👍']) : replyFor(text));
    });
  }, 2200);
}
function sendVoice(file) {
  if (!file || !(/^audio\//.test(file.type) || /\.(m4a|mp3|wav|ogg|oga|aac|amr|3gp|webm|opus)$/i.test(file.name || ''))) { toast('Choisissez un fichier audio.'); return; }
  if (file.size > 15 * 1024 * 1024) { toast('Cet audio dépasse 15 Mo.'); return; }
  const url = URL.createObjectURL(file), a = new Audio();
  let sent = false;
  const go = dur => { if (sent) return; sent = true; const id = uid(); ui.audio[id] = url; send('', null, {id, voice: true, dur}); };
  a.onloadedmetadata = () => go(isFinite(a.duration) ? Math.floor(a.duration / 60) + ':' + pad(Math.round(a.duration % 60)) : '');
  a.onerror = () => go('');
  setTimeout(() => go(''), 2500);
  a.src = url;
}
function sendPhoto(file) {
  if (!file || !/^image\//.test(file.type)) { toast('Choisissez un fichier image.'); return; }
  const r = new FileReader();
  r.onerror = () => toast('Cette image n’a pas pu être lue.');
  r.onload = () => {
    const im = new Image();
    im.onerror = () => toast('Cette image n’a pas pu être lue.');
    im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      send('', cv.toDataURL('image/jpeg', 0.82));
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ---------- Genius quiz ---------- */
function openQuiz(title, qs, vs) {
  ui.quiz = {title, vs: vs || null, i: 0, me: 0, opp: 0, picked: null, oppOk: false,
    qs: qs.map(q => ({q: q.q, opts: shuffle(q.o.map((t, k) => ({t, ok: k === 0})))}))};
  renderQuiz();
}
function renderQuiz() {
  const z = ui.quiz; if (!z) return;
  const n = z.qs.length;
  if (z.i >= n) {
    const win = !z.vs ? '' : z.me > z.opp ? 'Vous gagnez la battle 🏆' : z.me === z.opp ? 'Égalité.' : esc(z.vs) + ' gagne cette battle.';
    sheet(`${sheetHead(esc(z.title))}<div class="sheet-body"><div class="score"><b>${z.me} / ${n}</b>${z.vs ? `<span>${esc(z.vs)} : ${z.opp} / ${n}</span>` : ''}</div>
      ${win ? `<p>${win}</p>` : ''}<p>+${z.me} point${z.me > 1 ? 's' : ''} Genius. Total : ${fmt(S.genius)}.</p>
      <div class="sheet-actions"><button class="btn" type="button" data-act="close">Fermer</button></div></div>`, z.title);
    return;
  }
  const q = z.qs[z.i], done = z.picked !== null;
  sheet(`${sheetHead(esc(z.title))}<div class="sheet-body">
    <span class="lbl">Question ${z.i + 1} sur ${n}${z.vs ? ' · contre ' + esc(z.vs) : ''}</span>
    <p class="quiz-q">${esc(q.q)}</p>
    <div class="opts">${q.opts.map((o, k) => `<button class="opt${done && o.ok ? ' ok' : done && k === z.picked ? ' ko' : ''}" type="button" data-act="answer" data-k="${k}"${done ? ' disabled' : ''}>${esc(o.t)}</button>`).join('')}</div>
    ${done ? `<p role="status">${q.opts[z.picked].ok ? 'Bonne réponse !' : 'Raté. La bonne réponse est encadrée en vert.'}${z.vs ? ' ' + esc(z.vs) + (z.oppOk ? ' a trouvé aussi.' : ' s’est trompé.') : ''}</p>
      <div class="sheet-actions"><button class="btn" type="button" data-act="quizNext">${z.i + 1 < n ? 'Question suivante' : 'Voir le résultat'}</button></div>` : ''}
  </div>`, z.title, done ? '[data-act="quizNext"]' : '.opt');
}

/* ---------- simulated calls, with translated subtitles ---------- */
const CALL_LINES = [
  {me: false, said: 'Hi! Can you hear me well?', tr: 'Bonjour ! Tu m’entends bien ?'},
  {me: true, said: 'Oui, très bien. Merci d’avoir appelé.', tr: 'Yes, very well. Thanks for calling.'},
  {me: false, said: 'I wanted to confirm the delivery date.', tr: 'Je voulais confirmer la date de livraison.'},
  {me: true, said: 'La livraison est prévue lundi.', tr: 'Delivery is scheduled for Monday.'},
  {me: false, said: 'Perfect, that works for us.', tr: 'Parfait, cela nous convient.'},
];
function startCall(who, kind) {
  ui.call = Object.assign({kind, phase: 'ring', t0: 0, muted: false, spk: false, tr: who.lang === 'en', line: -1}, who);
  renderCall();
  callTimer = setTimeout(() => {
    if (!ui.call) return;
    ui.call.phase = 'live'; ui.call.t0 = Date.now(); renderCall();
    callTick = setInterval(callClock, 1000);
    if (ui.call.lang === 'en') { callSubT = setInterval(nextLine, 3400); setTimeout(nextLine, 900); }
  }, 3200);
}
function callClock() {
  const el = $('#callState'); if (!el || !ui.call) return;
  const s = Math.floor((Date.now() - ui.call.t0) / 1000); el.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60);
}
function subHtml() {
  const k = ui.call, l = CALL_LINES[k.line];
  if (!l) return '<small>Sous-titres traduits</small><span>La traduction s’affiche dès que quelqu’un parle.</span>';
  return `<small>${l.me ? 'Vous · français vers anglais' : esc(first(k.name)) + ' · anglais vers français'}</small><span>${esc(l.said)}</span><b>${esc(l.tr)}</b>`;
}
function nextLine() {
  const k = ui.call; if (!k || k.phase !== 'live') return;
  k.line = (k.line + 1) % CALL_LINES.length;
  const el = $('#callSub'); if (el) el.innerHTML = subHtml();
}
function renderCall() {
  const k = ui.call, canTr = k.lang === 'en';
  layer.innerHTML = `<div class="call" role="dialog" aria-modal="true" aria-label="Appel avec ${esc(k.name)}">
    <div class="call-top"><span>${k.kind === 'video' ? 'Appel vidéo' : 'Appel audio'}</span><b>${esc(k.name)}</b><span id="callState">${k.phase === 'ring' ? 'Sonnerie…' : '00:00'}</span></div>
    ${avatar(k.name, k.hue, 'lg', !!k.group)}
    ${canTr && k.tr && k.phase === 'live' ? `<div class="call-sub" id="callSub" aria-live="polite">${subHtml()}</div>` : ''}
    <div class="call-note">Simulation : aucun appel réel n’est passé${canTr ? ' et les sous-titres sont des exemples' : ''}.</div>
    <div class="call-btns">
      <button type="button" data-act="callToggle" data-k="muted" aria-pressed="${k.muted}" aria-label="Couper le micro">${I.mic}</button>
      <button type="button" data-act="callToggle" data-k="spk" aria-pressed="${k.spk}" aria-label="Haut-parleur">${I.sound}</button>
      ${canTr ? `<button type="button" data-act="callToggle" data-k="tr" aria-pressed="${k.tr}" aria-label="Traduction en direct">${I.translate}</button>` : ''}
      <button class="hang" type="button" data-act="endCall" aria-label="Raccrocher">${I.phone}</button>
    </div></div>`;
  if (k.phase === 'live') callClock();
}
function endCall() {
  const k = ui.call; if (!k) return;
  clearTimeout(callTimer); clearInterval(callTick); clearInterval(callSubT);
  S.calls.push({id: uid(), cid: k.cid || null, name: k.name, hue: k.hue, group: !!k.group, dir: 'out', kind: k.kind, ts: Date.now()});
  ui.call = null; layer.innerHTML = '';
  save(); if (ui.tab === 'calls') renderListBody(); toast('Appel terminé');
}

/* ---------- actions ---------- */
const ACT = {
  tab(d) { ui.tab = d.tab; renderTabs(); renderListHead(); renderListBody(); listBody.scrollTop = 0; },
  filter(d) { ui.filter = d.f; renderListHead(); renderListBody(); },
  liveTab(d) { ui.liveTab = d.t; renderListHead(); renderListBody(); },
  subject(d) { ui.subject = d.s; renderListHead(); renderListBody(); },
  open(d) { openChat(d.id); },
  back() { ui.chatId = null; app.dataset.view = 'list'; renderChat(); if (ui.tab === 'chats') renderListBody(); },
  fab() { newChatSheet(); },
  close() { closeLayer(); },
  newGroup() { newGroupSheet(); },
  newContact() { newContactSheet(); },
  startChat(d) {
    let c = S.chats.find(x => x.type === 'direct' && x.contactId === d.cid);
    if (!c) { c = {id: 'c-' + uid(), type: 'direct', contactId: d.cid, unread: 0, messages: [], created: Date.now()}; S.chats.push(c); }

  },
  emoji(d, el) { const p = $('#emojiPanel'); p.hidden = !p.hidden; el.setAttribute('aria-expanded', String(!p.hidden)); },
  emojiPick(d) {
    const i = $('#msgIn'), a = i.selectionStart ?? i.value.length, b = i.selectionEnd ?? a;
    i.value = i.value.slice(0, a) + d.e + i.value.slice(b);
    const pos = a + d.e.length; i.setSelectionRange(pos, pos); onDraft(i);
  },
  attach() { $('#fileIn').click(); },
  camera() { $('#camIn').click(); },
  mic() { voiceSheet(); },
  micPick() { $('#micIn').click(); },
  langPick() { langSheet(); },
  setLang(d) {
    const c = chatOf(ui.chatId); if (!c) return;
    c.toLang = d.l; closeLayer(); renderChat(); refresh(c.id);
    toast(d.l === 'fr' ? 'Traduction désactivée pour cette discussion' : 'Vos messages seront reçus en ' + langOf(d.l));
  },
  msgmenu(d) { msgMenu(d.mid); },
  orig(d) { ui.orig[d.mid] = !ui.orig[d.mid]; const y = $('#msgs').scrollTop; renderMessages(); $('#msgs').scrollTop = y; },
  react(d) { const m = curMsg(); if (m) { m.react = m.react === d.e ? null : d.e; } closeLayer(); refresh(ui.chatId); },
  unreact(d) { const c = chatOf(ui.chatId), m = c && c.messages.find(x => x.id === d.mid); if (m) { m.react = null; refresh(c.id); } },
  reply() { ui.replyTo = ui.menuMid; closeLayer(); renderReplyBar(); const i = $('#msgIn'); if (i) i.focus(); },
  cancelReply() { ui.replyTo = null; renderReplyBar(); },
  copy() {
    const m = curMsg(); closeLayer(); if (!m) return;
    try { navigator.clipboard.writeText(m.text).then(() => toast('Message copié'), () => toast('La copie n’est pas autorisée ici.')); }
    catch (e) { toast('La copie n’est pas autorisée ici.'); }
  },
  delMsg() { const m = curMsg(); if (m) { m.deleted = true; m.text = ''; delete m.img; delete m.tr; delete m.trState; delete m.orig; delete m.voice; m.react = null; } closeLayer(); refresh(ui.chatId); toast('Message supprimé'); },
  chatmenu() { chatMenu(); },
  info() { infoSheet(); },
  toggle(d) {
    const c = chatOf(ui.chatId); if (!c) return;
    if (d.k === 'tr') c.tr = c.tr === false; else c[d.k] = !c[d.k];
    closeLayer();
    if (d.k === 'tr') renderChat();
    refresh(c.id);
    toast({tr: c.tr !== false ? 'Traduction automatique activée' : 'Traduction automatique désactivée', muted: c.muted ? 'Discussion en sourdine' : 'Notifications réactivées', pinned: c.pinned ? 'Discussion épinglée' : 'Discussion désépinglée', fav: c.fav ? 'Ajoutée aux favoris' : 'Retirée des favoris'}[d.k]);
  },
  clear() { confirmSheet('Effacer la discussion ?', 'Tous les messages de cette discussion seront supprimés de ce navigateur.', 'Effacer', 'clearYes'); },
  clearYes() { const c = chatOf(ui.chatId); if (c) { c.messages = []; c.unread = 0; clearTimeout(replyTimers[c.id]); delete typing[c.id]; } closeLayer(); refresh(ui.chatId); toast('Discussion effacée'); },
  call(d) {
    const c = chatOf(ui.chatId); if (!c) return;
    const f = foreignOf(c);
    startCall({name: chatName(c), hue: chatHue(c), group: c.type === 'group', cid: c.type === 'direct' ? c.contactId : null, lang: f ? f.lang : 'fr'}, d.kind);
  },
  callRow(d) {
    const k = S.calls.find(x => x.id === d.id); if (!k) return;
    const p = k.cid && S.contacts[k.cid];
    startCall({name: p ? p.name : k.name, hue: p ? p.hue : k.hue, group: !!k.group, cid: p ? p.id : null, lang: p && p.lang ? p.lang : 'fr'}, k.kind);
  },
  callToggle(d) { if (ui.call) { ui.call[d.k] = !ui.call[d.k]; renderCall(); } },
  endCall() { endCall(); },
  status(d) { openStatus(d.sid); },

layer.addEventListener('pointerdown', e => {
  const c = ui.comp; if (!c) return;
  const el = e.target.closest('#cpStage .st-txt, #cpStage .stk'), stage = $('#cpStage .stage'); if (!el || !stage) return;
  const r = stage.getBoundingClientRect(), isT = el.classList.contains('st-txt'), k = isT ? -1 : +el.dataset.k, sx = e.clientX, sy = e.clientY;
  let moved = false;
  try { el.setPointerCapture(e.pointerId); } catch (err) {}
  const mv = ev => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
    moved = true; ev.preventDefault();
    const x = Math.round(Math.min(95, Math.max(5, (ev.clientX - r.left) / r.width * 100))), y = Math.round(Math.min(95, Math.max(5, (ev.clientY - r.top) / r.height * 100)));
    el.style.left = x + '%'; el.style.top = y + '%';
    if (isT) { c.tx = x; c.ty = y; } else if (c.stickers[k]) { c.stickers[k].x = x; c.stickers[k].y = y; }
  };
  const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); if (moved) c.dragged = Date.now(); };
  el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
});

icaines. Le texte original reste consultable. L’Éditeur ne garantit pas l’exactitude des traductions et n’est pas responsable des malentendus ou des conséquences qui pourraient en découler. Ne vous fiez pas à une traduction automatique pour une décision médicale, juridique ou financière.</p><h3>13. Lives éducatifs et Genius</h3><p>Les personnes qui animent un live sont seules responsables de leurs propos et de l’exactitude de ce qu’elles enseignent. Les commentaires sont modérés et peuvent être retirés. Les jeux et quiz Genius ont une vocation éducative ; les points obtenus n’ont aucune valeur monétaire.</p><h3>14. Collectes de fonds</h3><p>L’espace Collectes est réservé à des organismes dont l’agrément a été vérifié par l’Éditeur. L’Éditeur n’est pas partie aux dons : il n’encaisse ni ne détient les fonds, qui sont traités par un prestataire de paiement agréé. Chaque organisme est seul responsable de l’usage des fonds et des justificatifs qu’il publie. L’Éditeur peut retirer une collecte à tout moment en cas de doute. Les conditions propres aux dons sont précisées sur chaque collecte.</p><h3>15. Musique</h3><p>Les morceaux proposés dans l’application sont des compositions fournies par l’Éditeur pour un usage dans tam-tam. Lorsque vous ajoutez votre propre musique, vous garantissez disposer des droits nécessaires.</p><h3>16. Disponibilité du Service</h3><p>Le Service est fourni gratuitement, « en l’état » et selon sa disponibilité. L’Éditeur s’efforce d’en assurer l’accès mais peut l’interrompre, notamment pour maintenance, mise à jour ou raison de sécurité, sans indemnité. Les fonctionnalités peuvent évoluer, être modifiées ou supprimées.</p><h3>17. Responsabilité</h3><p>Dans toute la mesure permise par la loi :</p><ol><li>L’Éditeur n’est pas responsable des contenus publiés ou échangés par les utilisateurs, ni des relations entre utilisateurs.</li><li>L’Éditeur n’est pas responsable des dommages indirects (perte de données, de chance, de réputation ou de revenus) liés à l’utilisation ou à l’impossibilité d’utiliser le Service.</li><li>L’Éditeur n’est pas responsable des pertes de données dues à une mauvaise manipulation, à la perte ou au vol de votre appareil, ou à la divulgation de vos accès.</li><li>L’Éditeur n’est pas responsable des services tiers (Google, Facebook, opérateurs, prestataires de paiement, boutiques d’applications) ni de leurs conditions.</li></ol><p>Ces limitations ne s’appliquent pas en cas de faute lourde ou intentionnelle de l’Éditeur, ni lorsque la loi les interdit.</p><h3>18. Garantie de l’utilisateur</h3><p>Vous vous engagez à garantir l’Éditeur contre toute réclamation, action ou condamnation (y compris les frais d’avocat raisonnables) résultant d’un contenu que vous avez publié, d’un manquement aux présentes CGU ou d’une violation des droits d’un tiers.</p><h3>19. Suspension et suppression du compte</h3><ol><li>L’Éditeur peut, sans préavis ni indemnité, limiter, suspendre ou supprimer un compte en cas de manquement aux CGU, de signalements répétés, d’activité frauduleuse, de risque pour la sécurité des utilisateurs ou sur demande d’une autorité compétente.</li><li>Vous pouvez supprimer votre compte à tout moment depuis les Réglages. Vos données sont alors supprimées selon la Politique de confidentialité.</li></ol><h3>20. Propriété intellectuelle</h3><p>Le nom tam-tam, son logo, son interface, ses textes et ses logiciels sont protégés. Toute reproduction ou utilisation non autorisée est interdite. Le nom tam-tam fait l’objet d’une procédure de protection en cours.</p><h3>21. Modification des CGU</h3><p>L’Éditeur peut modifier les présentes CGU. Les utilisateurs sont informés de toute modification importante dans l’application au moins 15 jours avant son entrée en vigueur. Poursuivre l’utilisation du Service après cette date vaut acceptation des nouvelles conditions ; à défaut, vous pouvez supprimer votre compte.</p><h3>22. Droit applicable et litiges</h3><p>Les présentes CGU sont régies par le droit iquement pendant un partage que vous avez lancé.</li><li><b>Données techniques</b> : type d’appareil, version de l’application, journaux de sécurité, identifiants de connexion.</li></ul><p>tam-tam ne collecte aucune donnée bancaire. Les dons éventuels sont traités par un prestataire de paiement agréé.</p><h3>4. Pourquoi nous utilisons vos données</h3><ul><li>Fournir le Service (envoi des messages, statuts, appels, traduction).</li><li>Sécuriser les comptes (vérification des connexions, récupération du compte, détection des abus).</li><li>Traiter les signalements et appliquer les CGU.</li><li>Respecter nos obligations légales.</li><li>Améliorer le Service à partir de statistiques rendues anonymes.</li></ul><p>tam-tam ne vend pas vos données et ne les utilise pas pour de la publicité ciblée.</p><h3>5. Traduction automatique</h3><p>Pour traduire un message, son texte est transmis à un service de traduction automatique choisi par l’Éditeur. Ce prestataire est tenu par contrat de ne pas réutiliser ces textes à d’autres fins. Vous pouvez désactiver la traduction pour chaque discussion.</p><h3>6. Qui peut voir vos données</h3><ul><li>Les personnes avec qui vous échangez, et celles que vous avez autorisées pour vos statuts, souvenirs et partages de position.</li><li>Les prestataires techniques de l’Éditeur (hébergement, envoi d’e-mails, traduction), dans la limite de leur mission et sous contrat.</li><li>Les autorités, uniquement sur demande légalement fondée.</li></ul><h3>7. Transferts hors du Sénégal</h3><p>Certains prestataires peuvent être situés hors du Sénégal. Ces transferts ne sont réalisés que vers des pays ou des prestataires offrant un niveau de protection suffisant, dans les conditions prévues par la loi.</p><h3>8. Durée de conservation</h3><ul><li>Compte : tant que le compte est actif, puis suppression dans un délai de 30 jours après sa suppression.</li><li>Statuts : 24 heures, sauf si vous les enregistrez dans vos souvenirs.</li><li>Partage de position : la position n’est pas conservée après la fin du partage.</li><li>Journaux de sécurité : 12 mois au plus.</li><li>Signalements : le temps de leur traitement, puis au plus 12 mois.</li></ul><h3>9. Sécurité</h3><p>L’Éditeur met en œuvre des mesures techniques et organisationnelles adaptées : chiffrement des échanges entre l’appareil et les serveurs, chiffrement des données stockées, chiffrement de bout en bout des messages lorsque la fonction est disponible, vérification en deux étapes, code de verrouillage de l’application, contrôle strict des accès internes et tests de sécurité réguliers. Aucune mesure n’offre toutefois une sécurité absolue.</p><p>En cas de violation de données susceptible d’engendrer un risque pour vos droits, l’Éditeur en informe l’autorité compétente et, lorsque la loi l’exige, les personnes concernées.</p><h3>10. Vos droits</h3><p>Vous pouvez à tout moment accéder à vos données, les rectifier, vous opposer à certains traitements, demander leur suppression ou obtenir une copie de vos données, en écrivant à [ADRESSE E-MAIL DONNÉES PERSONNELLES]. Vous pouvez aussi saisir l’autorité de protection des données de votre pays.</p><h3>11. Mineurs</h3><p>Le Service est réservé aux personnes de 16 ans et plus. Si nous apprenons qu’un compte appartient à une personne plus jeune, il est supprimé.</p><h3>12. Modification de cette politique</h3><p>Toute modification importante vous sera signalée dans l’application avant son entrée en vigueur.</p>"};

FORMS.unlock = async () => {
  const L = ui.locked; if (!L) return;

    if (await sha($('#lkPin').value) === S.profile.pin) { ui.locked = null; layer.innerHTML = ''; toast('Bon retour, ' + first(S.profile.name) + ' !'); return; }
    L.tries++; const left = 5 - L.tries;
    openLock(left <= 0 ? 'Trop d’essais. Utilisez « Code oublié ».' : `Code incorrect. ${left} essai${left > 1 ? 's' : ''} restant${left > 1 ? 's' : ''}.`);
  } else if ($('#lkCode').value.trim() === L.code) {
