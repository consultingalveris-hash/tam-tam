<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tam-Tam</title>
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#fff;color:#0f2a3a;text-align:center;padding:24px;box-sizing:border-box}h1{color:#14B8C9;margin:0 0 8px}button{margin-top:20px;padding:12px 24px;border:0;border-radius:24px;background:#14B8C9;color:#fff;font-size:16px}</style></head>
<body><h1>Tam-Tam</h1><p>Pas de connexion Internet pour le moment.</p><p>Vérifiez le Wi-Fi ou les données mobiles, puis réessayez.</p>
<p id="st" style="font-size:14px;color:#557"></p>
<button id="again">Réessayer</button>
<script>
// L'adresse habituelle ne répond pas : on essaie ses adresses de secours (même serveur, autre chemin) avant d'afficher l'erreur.
var ADR = ['https://tam-tam.alveris-consulting.com', 'https://tam-tam.africa', 'https://tam-tam-relais.consultingalveris.workers.dev'];
function ping(o) { return new Promise(function (ok) { var t = setTimeout(function () { ok(false); }, 6000);
  fetch(o + '/api/ping', {cache: 'no-store', mode: 'cors', credentials: 'omit'}).then(function (r) { clearTimeout(t); ok(r.ok); }).catch(function () { clearTimeout(t); ok(false); }); }); }
async function essai() { var st = document.getElementById('st'); st.textContent = 'Recherche d’une adresse qui répond…';
  for (var i = 0; i < ADR.length; i++) { if (await ping(ADR[i])) { location.href = ADR[i] + '/'; return; } }
  st.textContent = ''; }
document.getElementById('again').onclick = essai;
if (navigator.onLine) essai();
</script></body></html>
